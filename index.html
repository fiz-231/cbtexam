<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경영학부 졸업시험 CBT 문제은행</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  
  <!-- 데이터 파일 직접 로드 (CORS 보안 에러 우회) -->
  <script src="./questions.js"></script>
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-md py-4 px-6 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-wide">경영학부 졸업시험 CBT System</h1>
        <p class="text-xs text-indigo-200 mt-0.5">중앙대학교 경영학부 문제은행 (전체 문항)</p>
      </div>
      <div class="bg-indigo-800 px-3 py-1.5 rounded-lg text-sm font-medium border border-indigo-700 flex items-center gap-3">
        <span>회차: <strong id="current-cycle" class="text-amber-300">1</strong>회차</span>
        <span class="text-indigo-400">|</span>
        <span>진행률: <strong id="progress-count" class="text-emerald-300">0</strong> / <span id="total-count">0</span></span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">

    <div id="quiz-card" class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col min-h-[480px]">
      
      <!-- Category & ID -->
      <div class="bg-slate-50 border-b border-slate-200 px-6 py-3 flex justify-between items-center text-sm font-semibold text-slate-600">
        <span id="subject-tag" class="px-3 py-1 rounded-full text-xs font-bold bg-indigo-100 text-indigo-800 uppercase">
          Loading...
        </span>
        <span id="question-id-text" class="text-slate-500">
          문제 ID: #-
        </span>
      </div>

      <!-- Card Body -->
      <div class="p-6 sm:p-8 flex-1 flex flex-col justify-between">
        
        <div>
          <!-- Question -->
          <div class="flex items-start gap-3">
            <span class="bg-indigo-600 text-white font-bold rounded-lg px-2.5 py-1 text-sm mt-0.5 shrink-0">Q</span>
            <div id="question-text" class="text-lg sm:text-xl font-medium text-slate-900 leading-relaxed">
              문제 데이터를 불러오는 중입니다...
            </div>
          </div>

          <!-- Options -->
          <div id="options-container" class="mt-8 space-y-3"></div>
        </div>

        <!-- Feedback -->
        <div id="feedback-container" class="mt-6 p-4 rounded-xl hidden border transition-all">
          <div class="flex items-center gap-2 font-bold text-base mb-1" id="feedback-status"></div>
          <div id="feedback-detail" class="text-sm text-slate-700 leading-relaxed mt-1"></div>
        </div>

        <!-- Footer -->
        <div class="mt-8 pt-4 border-t border-slate-100 flex justify-between items-center">
          <button onclick="resetProgress()" class="text-xs text-slate-400 hover:text-rose-600 underline">
            진행상황 초기화
          </button>
          
          <button id="next-btn" onclick="nextQuestion()" disabled class="bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold px-6 py-2.5 rounded-xl shadow-md transition-all">
            다음 문제
          </button>
        </div>

      </div>
    </div>

  </main>

  <script>
    let questionBank = [];
    let currentCycle = 1;
    let availableQuestions = [];
    let completedQuestionsCount = 0;
    let currentQuestion = null;
    let isAnswered = false;

    // Direct Load
    function loadQuestionBank() {
      if (window.questionBank && Array.isArray(window.questionBank)) {
        questionBank = window.questionBank;
        document.getElementById('total-count').innerText = questionBank.length;
        init();
      } else {
        document.getElementById('question-text').innerHTML = "<span class='text-rose-600 font-bold'>오류: `questions.js` 데이터를 불러올 수 없습니다.</span><br><br>1. `questions.json` 파일명을 <strong>`questions.js`</strong>로 변경했는지 확인해주세요.<br>2. `questions.js` 파일 맨 첫 줄에 <strong>window.questionBank = </strong> 구문이 추가되었는지 확인해주세요.";
      }
    }

    function shuffleArray(arr) {
      const array = [...arr];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function init() {
      const savedCycle = localStorage.getItem("cbt_cycle");
      const savedAvailable = localStorage.getItem("cbt_available");
      const savedCompleted = localStorage.getItem("cbt_completed");

      if (savedCycle && savedAvailable) {
        currentCycle = parseInt(savedCycle, 10);
        availableQuestions = JSON.parse(savedAvailable);
        completedQuestionsCount = parseInt(savedCompleted, 10) || 0;
      } else {
        startNewCycle(1);
      }

      updateHeaderStats();
      loadNextQuestion();
    }

    function startNewCycle(cycleNum) {
      currentCycle = cycleNum;
      availableQuestions = shuffleArray(questionBank.map(q => q.id));
      completedQuestionsCount = 0;
      saveState();
    }

    function saveState() {
      localStorage.setItem("cbt_cycle", currentCycle.toString());
      localStorage.setItem("cbt_available", JSON.stringify(availableQuestions));
      localStorage.setItem("cbt_completed", completedQuestionsCount.toString());
    }

    function resetProgress() {
      if (confirm("진행 상황을 초기화하고 1회차부터 다시 시작하시겠습니까?")) {
        localStorage.clear();
        startNewCycle(1);
        updateHeaderStats();
        loadNextQuestion();
      }
    }

    function updateHeaderStats() {
      document.getElementById('current-cycle').innerText = currentCycle;
      document.getElementById('progress-count').innerText = completedQuestionsCount;
    }

    function loadNextQuestion() {
      if (availableQuestions.length === 0) {
        alert(`축하합니다! ${currentCycle}회차의 모든 문제를 완료하셨습니다.\n다음 ${currentCycle + 1}회차 문제를 무작위로 새로 구성하여 시작합니다.`);
        startNewCycle(currentCycle + 1);
        updateHeaderStats();
      }

      const qId = availableQuestions[availableQuestions.length - 1];
      currentQuestion = questionBank.find(q => q.id === qId);

      isAnswered = false;
      document.getElementById('next-btn').disabled = true;
      document.getElementById('feedback-container').classList.add('hidden');

      document.getElementById('subject-tag').innerText = currentQuestion.subject;
      document.getElementById('question-id-text').innerText = `문제 ID: #${currentQuestion.id}`;
      document.getElementById('question-text').innerText = currentQuestion.question;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      currentQuestion.shuffledOptions = shuffleArray(currentQuestion.options);

      currentQuestion.shuffledOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "option-btn w-full text-left p-4 rounded-xl border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 transition-all flex items-center gap-3 group";
        btn.onclick = () => selectOption(idx);

        const badge = document.createElement('span');
        badge.className = "w-7 h-7 rounded-full bg-slate-100 text-slate-600 font-bold text-xs flex items-center justify-center shrink-0 group-hover:bg-indigo-600 group-hover:text-white transition-colors";
        badge.innerText = String.fromCharCode(65 + idx);

        const textSpan = document.createElement('span');
        textSpan.className = "text-slate-800 text-base flex-1";
        textSpan.innerText = opt.text;

        btn.appendChild(badge);
        btn.appendChild(textSpan);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(index) {
      if (isAnswered) return;
      isAnswered = true;

      const chosenOption = currentQuestion.shuffledOptions[index];
      const isCorrect = chosenOption.isCorrect;

      const optionBtns = document.querySelectorAll('.option-btn');
      optionBtns.forEach((btn, idx) => {
        btn.onclick = null;
        const opt = currentQuestion.shuffledOptions[idx];
        if (opt.isCorrect) {
          btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900', 'ring-1', 'ring-emerald-500');
          btn.querySelector('span').classList.add('bg-emerald-600', 'text-white');
        } else if (idx === index && !isCorrect) {
          btn.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-900');
          btn.querySelector('span').classList.add('bg-rose-600', 'text-white');
        } else {
          btn.classList.add('opacity-50');
        }
      });

      const feedbackContainer = document.getElementById('feedback-container');
      const feedbackStatus = document.getElementById('feedback-status');
      const feedbackDetail = document.getElementById('feedback-detail');

      feedbackContainer.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-200', 'bg-rose-50', 'border-rose-200');

      if (isCorrect) {
        feedbackContainer.classList.add('bg-emerald-50', 'border-emerald-200');
        feedbackStatus.className = "font-bold text-base text-emerald-700";
        feedbackStatus.innerText = "⭕ 정답입니다!";
      } else {
        feedbackContainer.classList.add('bg-rose-50', 'border-rose-200');
        feedbackStatus.className = "font-bold text-base text-rose-700";
        feedbackStatus.innerText = "❌ 오답입니다.";
      }

      feedbackDetail.innerText = currentQuestion.explanation || "해설이 제공되지 않은 문항입니다.";
      document.getElementById('next-btn').disabled = false;
    }

    function nextQuestion() {
      if (!isAnswered) return;

      availableQuestions.pop();
      completedQuestionsCount++;

      saveState();
      updateHeaderStats();
      loadNextQuestion();
    }

    window.onload = loadQuestionBank;
  </script>
</body>
</html>
